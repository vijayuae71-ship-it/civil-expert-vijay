[build]
  publish = "."
  functions = "netlify/functions"
  # Builds assets/site.css from the Tailwind classes used in the pages.
  command = "npm run build"

[build.environment]
  # Node 22 for the build and the functions (matches the version the tests run on).
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# One address for everyone: the main site is civilengineervijay.netlify.app (the Netlify project the
# owner manages, with its keys and settings). The second Netlify project that also builds this code
# forwards every page there, keeping the path and query (…/expert?q=x → civilengineervijay…/expert?q=x).
# It matches only that host, so the main site and deploy previews are not affected.
[[redirects]]
  from = "https://constructionaiexpert.netlify.app/*"
  to = "https://civilengineervijay.netlify.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/owner*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
